<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles — Index</title>
<meta name="description" content="Index of all articles in the llm-wiki-jk knowledge base, grouped by when they were updated, with en-US editions and zh-TW editions alongside.">
<link rel="canonical" href="https://graph.johnnykuo.com/pages/articles-index.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">
<link rel="stylesheet" href="themes/theme-02/theme.css">
<script src="themes/theme-02/theme.js"></script>
<script src="themes/theme-02/pages-core.js"></script>
<script src="themes/shared/index-core.js"></script>
<link rel="stylesheet" href="themes/shared/index.css">
<style>
/* Page-specific only — shared index chrome lives in themes/shared/index.css */
.article-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Card chrome (surface, border, accent variants) comes from theme.css .card */
.article-card {
  position: relative;
  padding: 16px 20px 13px;
  margin-bottom: 12px;
  transition: border-color 0.15s ease, transform 0.15s ease;
}

.article-card:hover {
  border-left-color: var(--oxblood-soft);
  transform: translateY(-1px);
}

.article-title {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}

.article-title a {
  color: var(--ink);
  text-decoration: none;
}

.article-title a:hover { color: var(--oxblood); }

/* Page-specific: zh subtitle + meta rows (star + stat chips come from index.css) */

.article-zh {
  font-size: 0.95rem;
  color: var(--ink-soft);
  margin: 0 0 10px;
}

.article-zh a {
  color: var(--mute);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.article-zh a:hover {
  color: var(--oxblood);
  border-bottom-color: var(--oxblood);
}

.article-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 8px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--faint);
  margin: 0 0 4px;
}

.article-meta:last-child { margin-bottom: 0; }

/* Descriptions are hidden by default (compact card list); the toggle in the
   search row flips this class on. Search still matches desc text either way. */
.no-desc .article-desc { display: none; }
.article-desc { color: var(--mute); font-size: .92rem; margin: 0 0 10px; }

/* Index-type entries (weight > 0 in articles.json) sit at the bottom of
   each bucket and render dimmed so real articles stay prominent. */
.article-card.is-index { opacity: 0.72; }

/* Descriptions toggle: reads as "off" when dimmed, "on" when accented */
.desc-toggle[aria-pressed="true"] { color: var(--oxblood); border-color: var(--oxblood); }
/* Sort toggle (index-core wireSort): accented when reversed (oldest first) */
.sort-toggle[aria-pressed="true"] { color: var(--oxblood); border-color: var(--oxblood); }

/* Badge base + fill/accent variants come from theme.css .badge.fill */
@media (max-width: 640px) {
  .article-card { padding: 14px 14px 12px; }
}
</style>
<link rel="stylesheet" href="themes/theme-02/dark.css">
</head>
<body>
<main class="index" id="content">
  <div class="wrap">
    <div class="search-row" id="searchRow">
      <input type="search" id="searchBox" placeholder="search articles… / 搜尋文章" autocomplete="off">
      <button type="button" id="searchClear" class="search-clear" title="Clear / 清除" hidden>&times;</button>
      <button type="button" id="sortToggle" class="search-clear sort-toggle" aria-label="Toggle sort order / 切換排序">↓</button>
      <button type="button" id="descToggle" class="search-clear desc-toggle" title="Toggle descriptions / 切換說明" aria-pressed="false">¶</button>
    </div>
    <div id="articleList"></div>
    <p class="empty-note" id="noMatchNote" hidden></p>
    <p class="empty-note" id="emptyNote" hidden></p>
  </div>
</main>

<script>
(function(){
  const { esc, highlight, parseQuery, asStr, relAge, bucket, UPDATED_BUCKETS,
    FLAGS_OVERLAY_ENABLED, flagsUrl, announceNavigate, wireSort, wireDescLang,
    restoreQuery, persistQuery, wireSearch, statChips } = window.IndexCore;
  const BUCKETS = UPDATED_BUCKETS;
  const ACCENTS = ['', 'slate', 'forest', 'gold'];
  const SEARCH_KEY = 'articles-index-search';
  const list = document.getElementById('articleList');
  const emptyNote = document.getElementById('emptyNote');
  const noMatchNote = document.getElementById('noMatchNote');
  const searchBox = document.getElementById('searchBox');
  const searchClear = document.getElementById('searchClear');
  const descToggle = document.getElementById('descToggle');
  const DESC_KEY = 'articles-index-desc';
  /* Descriptions hidden by default; the ¶ toggle flips them and remembers
     the choice for the session. */
  let showDesc = false;
  try { showDesc = sessionStorage.getItem(DESC_KEY) === '1'; } catch { /* storage unavailable */ }
  /* Restore the query from a previous visit so returning from an article
     keeps the active filter. */
  restoreQuery(searchBox, SEARCH_KEY);

  function matches(a, tokens){
    if (!tokens.length) return true;
    /* Search both language descriptions regardless of the shown one. */
    const hay = [a.display, a.zhTitle, a.descEn, a.descZh, a.id].join('\n').toLowerCase();
    return tokens.every(t => hay.includes(t));
  }

  /* DB-backed flag overlay (content_flags via the FastAPI adapter). The
     static `starred` flags baked into articles.json remain the offline
     fallback; a DB value wins whenever the API is reachable.
     NOTE: overlay currently OFF — static flags only. Flip
     IndexCore.FLAGS_OVERLAY_ENABLED to true (and run
     deploy/supabase/content_flags.sql + scripts/sync/content_to_db.py
     --backfill-stars) to re-enable the DB overlay. */
  const FLAGS_API = flagsUrl();

  Promise.all([
    fetch('../data/articles.json').then(r => r.json()),
    FLAGS_OVERLAY_ENABLED
      ? fetch(FLAGS_API).then(r => r.json()).catch(() => null)
      : Promise.resolve(null),
    /* Generated card stats sidecar (readme-counts); missing/failed fetch
       degrades to chip-less cards. */
    fetch('../data/articles-stats.json').then(r => r.json()).catch(() => null),
  ])
  .then(([data, flagData, statData]) => {
    const statMap = (statData && statData.stats) || {};
    const dbFlags = (flagData && flagData.flags && flagData.flags.article) || {};
    const dbStarred = (a) => {
      const f = dbFlags[a.id];
      return f && Object.prototype.hasOwnProperty.call(f, 'starred')
        ? f.starred === true : a.starred === true;
    };
    const toTime = (s) => { const t = Date.parse(s || ''); return Number.isNaN(t) ? -Infinity : t; };
    const articles = data
      .filter(a => a.active !== false && a.id !== 'articles-index' && a.langs && a.langs['en-US'])
      .map((a, ai) => {
        const en = a.langs['en-US'];
        const zh = a.langs['zh-TW'];
        const starred = dbStarred(a);
        const weight = a.weight || 0;
        /* Sort/group by whichever is newer — created or updated (fall
           back to created when an entry has no updated date).
           Date.parse comparison (not string >) so mixed ISO formats
           still order correctly; unparsable dates sort as oldest. */
        /* Dates live at the top level (one created/updated per article id;
           zh-TW ships no dates). Lang-level dates still win if present
           (backward compat with older articles.json snapshots). */
        const updated = en.updated || a.updated || en.created || a.created || '';
        const created = en.created || a.created || '';
        const latest = toTime(updated) >= toTime(created) ? (updated || created) : created;
        const isNew = toTime(created) >= toTime(updated);
        return {
          id: a.id,
          _idx: ai,
          display: asStr(en.title),
          starred,
          stats: statMap[a.id] || null,
          weight,
          zhTitle: zh ? asStr(zh.title) : '',
          descEn: asStr(en.description || ''),
          descZh: zh ? asStr(zh.description || '') : '',
          enPath: en.path.replace(/^pages\//, ''),
          zhPath: zh ? zh.path.replace(/^pages\//, '') : en.path.replace(/^pages\//, ''),
          created,
          updated,
          latest,
          verb: isNew ? 'created' : 'updated',
          age: relAge(latest),
          /* Weighted entries (index pages) skip the time buckets and land
             together in the trailing Indexes section (bucket 4). */
          bucket: starred ? 0 : (weight > 0 ? BUCKETS.length - 1 : bucket(latest))
        };
      });

      /* Sort order flips only the date term (starred first and weight
         ascending stay fixed); newest-first is the default. */
      const getDir = wireSort(document.getElementById('sortToggle'), render);
      function sortArticles(){
        articles.sort((x, y) => (Number(y.starred) - Number(x.starred)) ||
          (x.weight - y.weight) ||
          ((toTime(y.latest) - toTime(x.latest)) * getDir()));
      }

      /* Active card description follows the Reader's EN/中 toggle
         (index-core wireDescLang); fallback covers single-language entries. */
      const getDescLang = wireDescLang(render);

      function render(){
        const zhDesc = getDescLang() === 'zh-TW';
        articles.forEach(a => { a.desc = zhDesc ? (a.descZh || a.descEn) : (a.descEn || a.descZh); });
        sortArticles();
        const tokens = parseQuery(searchBox.value);
        searchClear.hidden = !searchBox.value;
        let shown = 0;
        let html = '';
        BUCKETS.forEach(([label, zhLabel, cls], bi) => {
          const group = articles.filter(a => a.bucket === bi && matches(a, tokens));
          if (!group.length) return;
          shown += group.length;
          html += `<h2 class="bucket-heading">${label} / ${zhLabel}` +
                  `<span class="bucket-count">${group.length}</span></h2><ul class="article-list">`;
          html += group.map((a) => `
            <li class="article-card card ${ACCENTS[a._idx % ACCENTS.length]}${a.weight > 0 ? ' is-index' : ''}">
              <h2 class="article-title"><a href="${esc(a.enPath)}" data-article-id="${esc(a.id)}">${highlight(a.display, tokens)}</a></h2>
              <p class="article-zh"><a href="${esc(a.zhPath)}" data-article-id="${esc(a.id)}-zh" lang="zh-TW">${highlight(a.zhTitle, tokens)}</a></p>
              ${a.desc ? `<p class="article-desc">${highlight(a.desc, tokens)}</p>` : ''}
              <p class="article-meta"><span class="badge fill">${esc(a.id)}</span>${a.starred ? '<span class="card-star" title="Starred">★</span>' : ''}</p>
              <p class="article-meta"><span class="${cls}">${!a.latest ? 'date unknown' : a.age === 'today' ? `${a.verb} today` : `${a.verb} ${esc(a.age)} ago`}</span>${statChips(a.stats)}</p>
            </li>`).join('');
          html += '</ul>';
        });
        list.innerHTML = html;
        list.classList.toggle('no-desc', !showDesc);
        descToggle.setAttribute('aria-pressed', showDesc ? 'true' : 'false');
        noMatchNote.hidden = !(articles.length && !shown && tokens.length);
        noMatchNote.textContent = `No articles match “${searchBox.value.trim()}” / 沒有符合的文章`;
        persistQuery(searchBox, SEARCH_KEY);
      }
      render();

      /* Debounced re-render on input; the query survives navigation via
         sessionStorage so returning from an article keeps the filter. */
      wireSearch(searchBox, searchClear, SEARCH_KEY, render);

      descToggle.addEventListener('click', () => {
        showDesc = !showDesc;
        try { sessionStorage.setItem(DESC_KEY, showDesc ? '1' : '0'); }
        catch { /* storage unavailable */ }
        render();
      });

      emptyNote.hidden = articles.length > 0;
      if (!articles.length) emptyNote.textContent = 'No active articles found.';

      /* Embedded in the Reader: announce navigation so the parent
         dropdown/lang toggle updates immediately (before iframe load). */
      list.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-article-id]');
        if (!a) return;
        announceNavigate(a.dataset.articleId);
      });
    })
    .catch(err => {
      emptyNote.textContent = 'Failed to load data/articles.json: ' + err.message;
      emptyNote.hidden = false;
    });
})();
</script>
</body>
</html>
