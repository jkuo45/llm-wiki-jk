<!--
  Assumptions Lab (en-US shell) — scenario analysis over the triples graph.

  The engine is inlined in this file's module script; the styles live
  in themes/theme-01/pages.css ("Assumptions Lab" section, token-based so
  pages-light.css themes them automatically). This shell only supplies
  navigation, the language strings, and URL bases. The zh-TW counterpart is
  pages/zh-TW/assumptions.html (curated conflict content carries *_zh_TW
  fields in web/public/data/assumptions.json; node/predicate labels come from
  the site dictionaries with English fallback).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assumptions Lab</title>
<meta name="description" content="Pick a stance per knowledge-graph conflict (assumption A/B) and re-run graph analyses — metric deltas, path recomputation, impact diff — against the baseline.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="stylesheet" href="../themes/theme-01/pages.css">
<script src="../themes/theme-01/page-theme.js"></script>
<script defer src="../themes/theme-01/pages-core.js"></script>
</head>
<body style="--wrap-width:1100px;">

<nav>
  <div class="wrap">
    <a id="back-home" class="back-home" href="../index.html" title="Back to articles index">&#8592; Back</a>
  </div>
</nav>

<div class="wrap lab-body" id="content">
  <div style="border:1px solid var(--amber,#d97706); background:rgba(217,119,6,.08); border-radius:10px; padding:10px 16px; margin:6px 0 18px; font-size:.88rem;">
    <b style="color:var(--amber,#d97706);">⚖️ Work in progress</b> — conflict resolution and metric recalculation are still being tuned; scenarios and analyses may change. Selections are session-only and are <b>not</b> applied to the canonical graph build.
  </div>
  <p class="loading">Loading…</p>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Assumptions Lab — shared engine for the en-US and zh-TW shells.
//
// Conflicts/decision points are curated in web/public/data/assumptions.json
// (validated at build time by scripts/triples/rebuild.py; curation aid
// scripts/03_triple_lookup.py mapped a review report's triple ids to edge keys).
// Picking a stance per conflict derives a modified edge set from
// web/public/data/triples-edges.json; graph analyses (degree/PageRank deltas,
// shortest-path recomputation, impact diff) re-run client-side and compare
// against the baseline. Session-only state: selections reset on reload.
//
// Shells (pages/assumptions.html, pages/zh-TW/assumptions.html) import this
// module and call boot(I18N) with their language strings + URL bases. zh-TW
// node/predicate labels come from the site dictionaries (translations-zh-TW /
// predicates-zh-TW), with English fallback — mirroring the graph UI.
// ---------------------------------------------------------------------------

let I18N = null; // set by boot()

// ---------------------------------------------------------------------------
// State (session-only by design — selections reset on reload)
// ---------------------------------------------------------------------------
const S = {
  doc: null,            // assumptions.json
  edges: [],            // triples-edges.json (baseline)
  nodes: new Map(),     // id -> node record
  labels: new Map(),    // lowercase label (en + translated) -> id
  trans: {},            // en label -> zh-TW label (optional)
  pred: {},             // en predicate -> zh-TW predicate (optional)
  version: null,
  selections: new Map(),// conflictId -> option key ('base' | 'A' | 'B' …)
  results: null,
  customPaths: [],      // [[src,tgt], …] added by the user
};

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));
// i18n string lookup with {placeholder} interpolation.
const tf = (key, vars = {}) => String((I18N.t && I18N.t[key]) ?? key)
  .replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
const fmt = (x) => (Math.abs(x) >= 0.01 ? x.toFixed(3) : x.toPrecision(3));
const fmtDelta = (d) => (Math.abs(d) < 1e-12 ? '±0'
  : `<span class="${d > 0 ? 'delta-up' : 'delta-down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`);
const key3 = (f, l, t) => `${f}\u0000${l}\u0000${t}`;
const confOf = (e) => (typeof e.confidence_score === 'number' ? e.confidence_score : 0.5);
const graphUrl = (id) => `${I18N.indexUrl}&node=${encodeURIComponent(id)}`;
// Prefer the `*_zh_TW` variant of a curated field when running the zh shell.
const pick = (obj, base) => (obj ? ((I18N.lang === 'zh-TW' && obj[`${base}_zh_TW`]) || obj[base]) || '' : '');
const num = (n) => Number(n).toLocaleString(I18N.locale);

// ---------------------------------------------------------------------------
// Bilingual display (site dictionaries, English fallback)
// ---------------------------------------------------------------------------
function displayLabel(id) {
  const n = S.nodes.get(id);
  const label = n ? n.label : id;
  return (I18N.lang === 'zh-TW' && S.trans[label]) ? S.trans[label] : label;
}
function displayPred(label) {
  return (I18N.lang === 'zh-TW' && S.pred[label]) ? S.pred[label] : label;
}

// ---------------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------------
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

async function loadAll() {
  const zh = I18N.lang === 'zh-TW';
  const [doc, edges, nodes, version, tasks, trans, pred] = await Promise.all([
    getJSON(`${I18N.dataBase}assumptions.json?v=${Date.now()}`),
    getJSON(`${I18N.dataBase}triples-edges.json`),
    getJSON(`${I18N.dataBase}triples-nodes.json`),
    getJSON(`${I18N.dataBase}version.json`).catch(() => null),
    getJSON(`${I18N.dataBase}tasks.json`).catch(() => null),
    zh ? getJSON(`${I18N.dataBase}translations-zh-TW.json`).catch(() => ({})) : Promise.resolve({}),
    zh ? getJSON(`${I18N.dataBase}predicates-zh-TW.json`).catch(() => ({})) : Promise.resolve({}),
  ]);
  S.doc = doc; S.edges = edges; S.version = version;
  S.trans = trans || {}; S.pred = pred || {};
  for (const n of nodes) {
    S.nodes.set(n.id, n);
    S.labels.set(String(n.label).toLowerCase(), n.id);
  }
  // Translated labels become search aliases (type 腎上腺素紅 or Adrenochrome).
  if (zh) for (const [en, zhLabel] of Object.entries(S.trans)) {
    if (S.labels.has(String(en).toLowerCase()) && !S.labels.has(String(zhLabel).toLowerCase())) {
      S.labels.set(String(zhLabel).toLowerCase(), S.labels.get(String(en).toLowerCase()));
    }
  }
  // Resolve the source review document's reader path via tasks.json
  // (zh-TW shell prefers the translated task output when one exists).
  const sc = doc.scenarios[0];
  if (tasks && sc?.sourceTask) {
    const entry = (tasks.tasks || []).find((t) => t.id === `task:${sc.sourceTask}`);
    const langKey = zh && entry?.langs?.['zh-TW'] ? 'zh-TW' : 'en-US';
    const p = entry?.langs?.[langKey]?.path;
    if (p) {
      S.sourceUrl = `${I18N.taskViewerUrl}?src=${encodeURIComponent('../' + p)}`;
    }
  }
}

// ---------------------------------------------------------------------------
// Scenario engine — derive a modified edge set from the selections
// ---------------------------------------------------------------------------
function selectedEdits() {
  const edits = [];
  for (const sc of S.doc.scenarios) {
    for (const c of sc.conflicts) {
      const optKey = S.selections.get(c.id);
      if (!optKey || optKey === 'base') continue;
      const opt = c.options.find((o) => o.key === optKey);
      if (opt) edits.push({ conflict: c, option: opt, edits: opt.edits || {} });
    }
  }
  return edits;
}

function deriveEdges() {
  const applied = selectedEdits();
  const removeKeys = new Set();
  const addEdges = [];
  const addKeys = new Set();
  for (const { edits } of applied) {
    for (const k of (edits.remove || [])) removeKeys.add(key3(k[0], k[1], k[2]));
    for (const a of (edits.add || [])) {
      const k = key3(a.from, a.label, a.to);
      if (!addKeys.has(k)) { addKeys.add(k); addEdges.push(a); }
    }
  }
  const kept = S.edges.filter((e) => !removeKeys.has(key3(e.from, e.label, e.to)));
  const removed = S.edges.filter((e) => removeKeys.has(key3(e.from, e.label, e.to)));
  return { applied, edges: kept.concat(addEdges), removed, added: addEdges };
}

function degreeMap(edges) {
  const deg = new Map();
  const bump = (id, n) => deg.set(id, (deg.get(id) || 0) + n);
  for (const e of edges) { bump(e.from, 1); bump(e.to, 1); }
  return deg;
}

// Directed PageRank over a multi-edge list (parallel edges each vote).
// ~2.7k nodes → plain power iteration is more than fast enough.
function pageRank(edges, nodes, damping = 0.85, maxIter = 60, tol = 1e-10) {
  const N = nodes.size;
  const out = new Map(); const inbound = new Map();
  for (const id of nodes) { out.set(id, 0); }
  for (const e of edges) {
    if (!nodes.has(e.from) || !nodes.has(e.to)) continue;
    out.set(e.from, out.get(e.from) + 1);
    if (!inbound.has(e.to)) inbound.set(e.to, []);
    inbound.get(e.to).push(e.from);
  }
  let pr = new Map(); for (const id of nodes) pr.set(id, 1 / N);
  let dangling = [...nodes].filter((id) => !out.get(id));
  for (let it = 0; it < maxIter; it++) {
    let dsum = 0; for (const id of dangling) dsum += pr.get(id);
    const base = (1 - damping) / N + damping * dsum / N;
    const next = new Map(); for (const id of nodes) next.set(id, base);
    for (const [to, froms] of inbound) {
      let acc = 0;
      for (const f of froms) acc += pr.get(f) / out.get(f);
      next.set(to, next.get(to) + damping * acc);
    }
    let err = 0; for (const id of nodes) err += Math.abs(next.get(id) - pr.get(id));
    pr = next;
    if (err < tol) break;
  }
  return pr;
}

// Shortest path (Dijkstra) over the given edge list. weight = 1 - confidence
// (+ tiny hop bias so equal-cost routes prefer fewer hops). Undirected matches
// the scripts/analysis/node_analysis convention; directed restricts to from→to.
function shortestPath(edges, src, tgt, directed = false) {
  const adj = new Map();
  const push = (a, e) => {
    if (!adj.has(a)) adj.set(a, []);
    adj.get(a).push(e);
  };
  for (const e of edges) {
    push(e.from, { to: e.to, label: e.label, conf: confOf(e) });
    if (!directed) push(e.to, { to: e.from, label: e.label, conf: confOf(e), rev: true });
  }
  if (!adj.has(src)) return null; // target needs no outbound edges
  const dist = new Map([[src, 0]]);
  const prev = new Map();
  const visited = new Set();
  // Binary-heap-lite: at this scale a simple array queue is fine.
  const queue = [[0, src]];
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u] = queue.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === tgt) break;
    for (const e of (adj.get(u) || [])) {
      if (visited.has(e.to)) continue;
      const w = (1 - e.conf) + 1e-6;
      const nd = d + w;
      if (nd < (dist.get(e.to) ?? Infinity)) {
        dist.set(e.to, nd);
        prev.set(e.to, { from: u, ...e });
        queue.push([nd, e.to]);
      }
    }
  }
  if (!dist.has(tgt)) return null;
  const hops = [];
  let cur = tgt;
  while (cur !== src) {
    const p = prev.get(cur);
    if (!p) return null;
    hops.unshift({ from: p.from, to: cur, label: p.label, conf: p.conf, rev: !!p.rev });
    cur = p.from;
  }
  return hops;
}

const hopSet = (hops) => new Set(hops.map((h) => `${h.from}\u0001${h.to}\u0001${h.label}`));

function pathVerdict(base, scn) {
  if (!base && !scn) return { cls: 'same', text: tf('verdictNone') };
  if (base && scn) {
    if (base.length === scn.length &&
        base.every((h, i) => h.from === scn[i].from && h.to === scn[i].to)) {
      return { cls: 'same', text: tf('verdictSame', { n: base.length }) };
    }
    return { cls: 'rerouted', text: tf('verdictRerouted', { a: base.length, b: scn.length }) };
  }
  if (!base && scn) return { cls: 'new', text: tf('verdictNew', { n: scn.length }) };
  return { cls: 'broken', text: tf('verdictBroken', { n: base.length }) };
}

// ---------------------------------------------------------------------------
// Analysis — metrics + paths under the derived edge set
// ---------------------------------------------------------------------------
function analyze() {
  const { applied, edges, removed, added } = deriveEdges();
  const nodeIds = new Set(S.nodes.keys());

  const degBase = degreeMap(S.edges);
  const degScn = degreeMap(edges);
  const prBase = pageRank(S.edges, nodeIds);
  const prScn = pageRank(edges, nodeIds);

  // Watchlist: anchors of every conflict + endpoints of edited edges.
  const watch = new Set();
  for (const sc of S.doc.scenarios) for (const c of sc.conflicts) (c.anchor || []).forEach((a) => watch.add(a));
  for (const e of removed) { watch.add(e.from); watch.add(e.to); }
  for (const e of added) { watch.add(e.from); watch.add(e.to); }

  const metricRows = [...watch].filter((id) => S.nodes.has(id)).map((id) => ({
    id,
    label: S.nodes.get(id).label,
    degBase: degBase.get(id) || 0,
    degScn: degScn.get(id) || 0,
    prBase: prBase.get(id) || 0,
    prScn: prScn.get(id) || 0,
  })).sort((a, b) =>
    Math.abs(b.prScn - b.prBase) - Math.abs(a.prScn - a.prBase) ||
    Math.abs(b.degScn - b.degBase) - Math.abs(a.degScn - a.degBase));

  const disconnected = metricRows.filter((r) => r.degBase > 0 && r.degScn === 0).map((r) => r.id);

  const directed = S.pathDirected === true;
  const presets = [];
  for (const sc of S.doc.scenarios) {
    for (const [src, tgt] of (sc.pathPresets || [])) presets.push({ src, tgt });
  }
  for (const [src, tgt] of S.customPaths) presets.push({ src, tgt, custom: true });
  const paths = presets.map(({ src, tgt }) => ({
    src, tgt, custom: false,
    base: shortestPath(S.edges, src, tgt, directed),
    scn: shortestPath(edges, src, tgt, directed),
  })).filter((p) => p.base || p.scn);

  return { applied, removed, added, edges, metricRows, disconnected, paths, degBase, degScn };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function nodeLink(id) {
  const n = S.nodes.get(id);
  const en = n ? n.label : id;
  const shown = displayLabel(id);
  const title = tf('openGraphTitle', { label: shown === en ? en : `${shown} (${en})` });
  return `<a class="node-link" href="${esc(graphUrl(id))}" title="${esc(title)}">${esc(shown)}</a>`;
}

function edgeHtml(e) {
  const from = e.rev ? e.to : e.from;
  const to = e.rev ? e.from : e.to;
  return `<div class="edge-line">${nodeLink(from)} <span class="rel">--${esc(displayPred(e.label))}--&gt;</span> ${nodeLink(to)
  }<span class="conf">${tf('confLabel')} ${fmt(confOf(e))}</span></div>`;
}

function renderHeader() {
  const sc = S.doc.scenarios[0];
  const nConf = sc.conflicts.length;
  const nEdits = sc.conflicts.reduce((acc, c) => acc + c.options.reduce((a, o) => {
    const e = o.edits || {};
    return a + (e.remove || []).length + (e.add || []).length;
  }, 0), 0);
  $('#content').innerHTML = `
    <h1>⚖️ ${esc(pick(sc, 'title'))}</h1>
    <p class="lab-sub">${esc(pick(sc, 'description'))} ${tf('subTail')}</p>
    <p class="lab-meta">${tf('meta', {
      conflicts: nConf, edits: nEdits, edges: num(S.edges.length), nodes: num(S.nodes.size),
    })}${S.version ? ` · ${tf('dataBuild')} <code>${esc(S.version.hash)}</code>` : ''}</p>
    <div class="action-bar" id="action-bar">
      <span class="count" id="sel-count">${tf('countBase', { sel: 0, total: nConf })}</span>
      <span class="spacer"></span>
      <button class="btn-ghost" id="btn-reset" disabled>${tf('reset')}</button>
      <button class="btn" id="btn-run" disabled>${tf('run')}</button>
    </div>
    <div id="conflicts"></div>
    <section id="results" style="padding:0; border-top:none;"></section>
    <div class="resolved-note" id="resolved-note"></div>
    <footer><div class="wrap" style="padding:0;">${I18N.footerHtml}</div></footer>`;
  $('#foot-source').addEventListener('click', (ev) => {
    ev.preventDefault();
    if (S.sourceUrl) window.open(S.sourceUrl, '_blank', 'noopener');
  });
}

function renderConflicts() {
  const sc = S.doc.scenarios[0];
  const tiers = new Map();
  for (const c of sc.conflicts) {
    if (!tiers.has(c.tier)) tiers.set(c.tier, []);
    tiers.get(c.tier).push(c);
  }
  const tierNote = { 1: 'tierNote1', 2: 'tierNote2', 3: 'tierNote3' };
  const host = $('#conflicts');
  host.innerHTML = '';
  for (const tier of [...tiers.keys()].sort()) {
    const h = document.createElement('h2');
    h.className = 'tier-heading';
    h.innerHTML = `${tf('tierLabel', { n: tier })} <span class="tnote">${tf(tierNote[tier] || '')}</span>`;
    host.appendChild(h);
    for (const c of tiers.get(tier)) host.appendChild(conflictCard(c));
  }
}

function conflictCard(c) {
  const el = document.createElement('div');
  el.className = 'conflict';
  const evidence = (c.evidence || []).length
    ? c.evidence.map((e) => edgeHtml(e) +
        (e.source ? `<div class="edge-src">📄 ${esc(e.source)}</div>` : '') +
        (e.context || e.context_zh_TW
          ? `<div class="edge-ctx"><details><summary>${tf('contextToggle')}</summary><span class="full">${esc(pick(e, 'context'))}</span></details></div>`
          : '')
      ).join('')
    : `<div class="evidence"><span class="none">${tf('noBaselineEdge')}</span></div>`;
  el.innerHTML = `
    <div><span class="cid t${c.tier}">${esc(c.id)}</span><h3>${esc(pick(c, 'title'))}</h3></div>
    <div class="summary">${esc(pick(c, 'summary'))}</div>
    <div class="evidence">${evidence}</div>
    <div class="opts">
      <span class="opt-pill">
        <input type="radio" name="${esc(c.id)}" value="base" id="${esc(c.id)}-base" checked>
        <label for="${esc(c.id)}-base"><b>·</b>${tf('baselinePill')}</label>
      </span>
      ${c.options.map((o) => `
      <span class="opt-pill">
        <input type="radio" name="${esc(c.id)}" value="${esc(o.key)}" id="${esc(c.id)}-${esc(o.key)}">
        <label for="${esc(c.id)}-${esc(o.key)}" title="${esc(pick(o, 'detail'))}"><b>${esc(o.key)}</b>${esc(pick(o, 'label'))}</label>
      </span>`).join('')}
    </div>
    <div class="opt-detail" id="${esc(c.id)}-detail"></div>`;

  el.addEventListener('change', (ev) => {
    if (ev.target.name !== c.id) return;
    S.selections.set(c.id, ev.target.value);
    const opt = c.options.find((o) => o.key === ev.target.value);
    const d = $(`#${CSS.escape(c.id)}-detail`, el);
    const nRm = (opt?.edits?.remove || []).length;
    const nAd = (opt?.edits?.add || []).length;
    d.textContent = opt && ev.target.value !== 'base'
      ? tf('appliedWhenRun', { rm: nRm, add: nAd, detail: pick(opt, 'detail') || '' })
      : '';
    updateActions();
  });
  return el;
}

function updateActions() {
  const sc = S.doc.scenarios[0];
  const n = S.selections.size;
  const any = [...S.selections.values()].some((v) => v !== 'base');
  $('#sel-count').innerHTML = any
    ? tf('countDecided', { sel: n, total: sc.conflicts.length }).replace(/(\d+\/\d+)/, '<b>$1</b>')
    : tf('countBase', { sel: n, total: sc.conflicts.length });
  $('#btn-run').disabled = !any;
  $('#btn-reset').disabled = n === 0 && !S.results;
}

// ---------------------------------------------------------------------------
// Results rendering
// ---------------------------------------------------------------------------
function verdictBadge(v) {
  return `<span class="verdict ${v.cls}">${esc(v.text)}</span>`;
}

function hopLines(hops, baseHops) {
  if (!hops || !hops.length) return `<div class="no-path">${tf('noPath')}</div>`;
  const baseSet = baseHops ? hopSet(baseHops) : null;
  return hops.map((h) => {
    const isNew = baseSet && !baseSet.has(`${h.from}\u0001${h.to}\u0001${h.label}`);
    const arrow = h.rev ? '&lt;--' : '--&gt;';
    return `<div class="hop">${nodeLink(h.from)} <span class="rel ${isNew ? 'changed' : ''}">--${esc(displayPred(h.label))}${arrow}</span> ${nodeLink(h.to)
    } <span class="conf">(${fmt(h.conf)})</span></div>`;
  }).join('');
}

function renderResults() {
  const R = S.results;
  const sec = $('#results');
  sec.style.display = '';
  const removedN = R.removed.length, addedN = R.added.length;
  const chips = `
    <div class="impact-chips">
      <span class="ichip"><b>${R.applied.length}</b> ${tf('chipsApplied')}</span>
      <span class="ichip ${removedN ? 'neg' : ''}"><b>−${removedN}</b> ${tf('chipsRemoved')}</span>
      <span class="ichip ${addedN ? 'pos' : ''}"><b>+${addedN}</b> ${tf('chipsAdded')}</span>
      <span class="ichip"><b>${R.metricRows.length}</b> ${tf('chipsWatched')}</span>
      ${R.disconnected.length ? `<span class="ichip neg"><b>${R.disconnected.length}</b> ${tf('chipsDisconnected', {
        names: esc(R.disconnected.slice(0, 4).map(displayLabel).join(', ')),
        more: R.disconnected.length > 4 ? '…' : '',
      })}</span>` : ''}
    </div>`;

  const metricRows = R.metricRows.slice(0, 25).map((r) => {
    const dd = r.degScn - r.degBase;
    const dp = r.prScn - r.prBase;
    return `<tr>
      <td>${nodeLink(r.id)}</td>
      <td>${r.degBase}</td><td>${r.degScn}</td><td>${fmtDelta(dd)}</td>
      <td>${fmt(r.prBase)}</td><td>${fmt(r.prScn)}</td><td>${fmtDelta(dp)}</td>
    </tr>`;
  }).join('');
  const hidden = R.metricRows.length - Math.min(25, R.metricRows.length);

  const pathBlocks = R.paths.map(({ src, tgt, base, scn, custom }) => {
    const v = pathVerdict(base, scn);
    const name = `${displayLabel(src)} → ${displayLabel(tgt)}`;
    return `<div class="path-block">
      <h4>${esc(name)}${custom ? ` <span style="color:var(--mute);font-size:.72rem;">${tf('customTag')}</span>` : ''}${verdictBadge(v)}</h4>
      <div class="path-cols">
        <div class="path-col"><div class="phead">${tf('pheadBase')}</div>${hopLines(base, null)}</div>
        <div class="path-col"><div class="phead">${tf('pheadScn')}</div>${hopLines(scn, base)}</div>
      </div>
    </div>`;
  }).join('');

  const seen = new Set();
  const labels = [...S.nodes.values()]
    .map((n) => displayLabel(n.id))
    .filter((l) => !seen.has(l) && seen.add(l))
    .sort((a, b) => a.localeCompare(b, I18N.locale));
  const dl = `<datalist id="node-labels">${labels.map((l) => `<option value="${esc(l)}">`).join('')}</datalist>`;

  sec.innerHTML = `
    <h2>${tf('resultsTitle')}</h2>
    ${chips}
    <h2 style="font-size:1.05rem;">${tf('metricTitle')}</h2>
    <p class="metric-note">${tf('metricNote', {
      top: Math.min(25, R.metricRows.length), total: R.metricRows.length,
    })}</p>
    <div class="tbl-wrap" style="max-height:420px;">
      <table>
        <thead><tr><th>${tf('thNode')}</th><th>${tf('thDegBase')}</th><th>${tf('thDegScn')}</th><th>${tf('thDegDelta')}</th>
          <th>${tf('thPrBase')}</th><th>${tf('thPrScn')}</th><th>${tf('thPrDelta')}</th></tr></thead>
        <tbody>${metricRows || `<tr><td colspan="7">${tf('noChanges')}</td></tr>`}</tbody>
      </table>
    </div>
    ${hidden > 0 ? `<p class="metric-note">${tf('moreNodes', { n: hidden })}</p>` : ''}
    <h2 style="font-size:1.05rem; margin-top:26px;">${tf('pathTitle')}</h2>
    <p class="path-note">${tf('pathNote', {
      mode: S.pathDirected ? tf('pathModeDirected') : tf('pathModeUndirected'),
    })}
      <label style="cursor:pointer;"><input type="checkbox" id="dir-toggle" ${S.pathDirected ? 'checked' : ''}> ${tf('directedToggle')}</label>
      ${tf('hopsNote')}</p>
    ${pathBlocks || `<p class="path-note">${tf('noPresets')}</p>`}
    ${dl}
    <div class="custom-path-row">
      <input id="cp-src" list="node-labels" placeholder="${esc(I18N.t.fromPlaceholder)}">
      <input id="cp-tgt" list="node-labels" placeholder="${esc(I18N.t.toPlaceholder)}">
      <button class="btn-ghost" id="cp-add">${tf('addPath')}</button>
    </div>`;

  $('#dir-toggle').addEventListener('change', (ev) => {
    S.pathDirected = ev.target.checked;
    R.paths = analyze().paths;
    renderResults();
  });
  $('#cp-add').addEventListener('click', () => {
    const src = S.labels.get($('#cp-src').value.trim().toLowerCase());
    const tgt = S.labels.get($('#cp-tgt').value.trim().toLowerCase());
    if (!src || !tgt || src === tgt) return;
    if (!S.customPaths.some(([a, b]) => a === src && b === tgt)) S.customPaths.push([src, tgt]);
    S.results = analyze();
    renderResults();
  });
}

function renderResolvedNotes() {
  const sc = S.doc.scenarios[0];
  const notes = sc.resolvedUpstream || [];
  if (!notes.length) return;
  $('#resolved-note').innerHTML = `
    <b style="color:var(--dim);">${tf('resolvedHeader')}</b>
    <ul style="margin:6px 0 0 18px;">${notes.map((n) => `<li><b>${esc(n.ref)}</b> — ${esc(pick(n, 'note'))}</li>`).join('')}</ul>`;
}

// ---------------------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------------------
function runAnalysis() {
  S.results = analyze();
  renderResults();
  $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetAll() {
  S.selections.clear();
  S.customPaths = [];
  S.results = null;
  document.querySelectorAll('.conflict input[type=radio][value=base]').forEach((r) => { r.checked = true; });
  document.querySelectorAll('.opt-detail').forEach((d) => { d.textContent = ''; });
  const sec = $('#results');
  sec.style.display = 'none';
  sec.innerHTML = '';
  updateActions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function boot(i18n) {
  I18N = i18n;
  try {
    await loadAll();
    renderHeader();
    renderConflicts();
    renderResolvedNotes();
    $('#btn-run').addEventListener('click', runAnalysis);
    $('#btn-reset').addEventListener('click', resetAll);
    updateActions();
  } catch (e) {
    console.error(e);
    $('#content').innerHTML = `<p class="error">${tf('errorPrefix')}${esc(e.message)}</p>`;
  }
}
