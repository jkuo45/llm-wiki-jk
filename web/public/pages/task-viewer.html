<!--
  Entity descriptions are sourced from the canonical knowledge graph
  graphify-out/graph.json — build 867a5ae5fdb8a46c (2,596 nodes / 3,737 edges).
  The frontend serves the derived web/data/nodes.json (same build); the backend
  reads graphify-out/graph.json directly. web/data/graph.json has been retired.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Output</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<link rel="stylesheet" href="themes/theme-01/pages.css">
<script src="themes/theme-01/page-theme.js"></script>
<style>
/* Task-output specific rendering (callouts, wiki links, tables) layered
   on top of the shared article stylesheet. */
.task-body { padding-bottom:64px; }
.task-body h1 { margin-top:8px; }
.task-body section { padding:20px 0; }
.task-body table { border-collapse:collapse; min-width:max-content; width:100%; font-size:.92rem; }
.table-wrap { overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch; }
.table-wrap table { margin:0; }
.task-body th, .task-body td { border:1px solid var(--line2); padding:7px 10px; text-align:left; vertical-align:top; }
.task-body th { background:var(--card); }
/* Frozen first column: solid opaque background so horizontally scrolled
   rows don't show through (zebra striping must not override this). */
.task-body table thead th:first-child,
.task-body table tbody th:first-child,
.task-body table tbody td:first-child {
  position:sticky; left:0; z-index:1;
  background:var(--bg);
  box-shadow:1px 0 0 var(--line2);
}
.task-body table thead th:first-child { z-index:3; }
.task-body tr:nth-child(even) td { background:color-mix(in srgb, var(--card) 45%, transparent); }
.task-body pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; }
/* Rendered ```mermaid fences (replaces the fallback <pre><code> block) */
.mermaid-figure { margin:14px 0; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow-x:auto; text-align:center; }
.mermaid-figure svg { max-width:100%; height:auto; }
/* Deeper indentation for (nested) bullet points */
.task-body ul, .task-body ol { padding-left:32px; }
.task-body ul ul, .task-body ol ul, .task-body ul ol, .task-body ol ol { padding-left:36px; }
.task-body code { font-size:.88em; }
.task-body blockquote { border-left:3px solid var(--teal); margin:10px 0; padding:4px 14px; color:var(--dim); }
.callout { border:1px solid var(--line2); border-left-width:4px; border-radius:8px;
           padding:10px 16px; margin:16px 0; background:var(--card); }
.callout-title { font-weight:700; margin-bottom:4px; }
.callout-info   { border-left-color:#4da3ff; }
.callout-tip    { border-left-color:#38c793; }
.callout-important { border-left-color:#a78bfa; }
.callout-warning   { border-left-color:#ffb020; }
.callout-caution   { border-left-color:#ff6b6b; }
.callout-note      { border-left-color:#4da3ff; }
.callout-example   { border-left-color:#38c793; }
.callout-quote     { border-left-color:var(--dim); }
 a.wikilink { color:var(--teal); text-decoration:none; border-bottom:1px dashed color-mix(in srgb, var(--teal) 55%, transparent); }
 span.wikilink { color:var(--dim); border-bottom:1px dashed var(--line2); }
/* Entities backed by a graphify-out/graph.json description get a hover tooltip + click-to-expand
   modal, mirroring the reader/prompt panel behaviour. */
.task-entity-link { color:var(--teal); text-decoration:none; border-bottom:1px dashed color-mix(in srgb, var(--teal) 55%, transparent); cursor:help; }
.task-entity-link:hover { color:var(--teal-hover); }
#wiki-tooltip { position:fixed; max-width:340px; max-height:40vh; overflow-y:auto; background:var(--card); border:1px solid var(--line2); color:var(--text); padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.5; pointer-events:none; opacity:0; transition:opacity .15s; z-index:400; box-shadow:0 4px 16px rgba(0,0,0,.5); }
#wiki-tooltip.visible { opacity:1; }
#wiki-tooltip b { color:var(--teal); display:block; margin-bottom:4px; }
.wiki-tooltip-hint { color:var(--mute); font-size:11px; margin-top:4px; display:inline-block; }
#wiki-modal-overlay { position:fixed; inset:0; background:rgba(8,8,16,.7); display:none; align-items:center; justify-content:center; z-index:500; padding:24px; }
#wiki-modal-overlay.visible { display:flex; }
#wiki-modal { background:var(--bg); border:1px solid var(--line2); border-radius:12px; max-width:720px; width:100%; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
#wiki-modal-header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line2); }
#wiki-modal-header h2 { font-size:17px; color:var(--text); margin:0; padding-right:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#wiki-modal-header .wiki-modal-actions { display:flex; gap:8px; align-items:center; }
.wiki-modal-link { color:var(--teal); text-decoration:none; font-size:13px; display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:4px; border:1px solid var(--line2); }
.wiki-modal-link:hover { border-color:var(--teal); }
.wiki-modal-link[disabled] { opacity:.45; cursor:default; pointer-events:none; }
#wiki-modal-close { background:none; border:none; color:var(--dim); font-size:22px; cursor:pointer; line-height:1; }
#wiki-modal-close:hover { color:var(--text); }
#wiki-modal-body { padding:16px 20px; overflow-y:auto; }
#wiki-modal-body h1, #wiki-modal-body h2, #wiki-modal-body h3, #wiki-modal-body h4 { color:var(--text); margin:14px 0 8px; }
#wiki-modal-body h1 { font-size:18px; } #wiki-modal-body h2 { font-size:16px; }
#wiki-modal-body h3 { font-size:15px; } #wiki-modal-body h4 { font-size:14px; }
#wiki-modal-body p { margin:8px 0; }
#wiki-modal-body strong, #wiki-modal-body b { color:var(--text); }
#wiki-modal-body em { color:var(--teal); }
#wiki-modal-body code { background:var(--card); padding:1px 5px; border-radius:3px; font-size:13px; }
#wiki-modal-body pre { background:var(--card); padding:12px; border-radius:6px; overflow-x:auto; margin:10px 0; }
#wiki-modal-body pre code { padding:0; background:none; }
#wiki-modal-body ul, #wiki-modal-body ol { padding-left:20px; margin:8px 0; }
#wiki-modal-body li { margin:4px 0; }
#wiki-modal-body blockquote { border-left:3px solid var(--teal); padding:8px 12px; margin:10px 0; background:color-mix(in srgb, var(--teal) 8%, transparent); color:var(--dim); }
#wiki-modal-body hr { border:none; border-top:1px solid var(--line2); margin:16px 0; }
#wiki-modal-body table { border-collapse:collapse; width:100%; margin:10px 0; }
#wiki-modal-body th, #wiki-modal-body td { border:1px solid var(--line2); padding:6px 10px; font-size:13px; }
#wiki-modal-body th { background:var(--card); text-align:left; }
#wiki-modal-body a { color:var(--teal); text-decoration:underline; text-decoration-style:dotted; }
.task-meta { color:var(--dim); font-size:.85rem; margin:2px 0 18px; }
.loading { color:var(--dim); padding-top:48px; }
.error { color:#ff6b6b; padding-top:48px; }
/* Sticky-nav section picker (replaces the horizontal-scrolling link list) */
.toc-select { max-width:min(420px, 50vw); height:30px; font-size:.85rem; color:var(--text);
  background:var(--card); border:1px solid var(--line2); border-radius:8px; padding:0 8px; }
.toc-next { height:30px; margin-left:auto; font-size:.85rem; font-weight:700; color:var(--text);
  background:var(--card); border:1px solid var(--line2); border-radius:8px; padding:4px 12px; cursor:pointer; }
.toc-next:hover { color:var(--teal); border-color:var(--teal); }
/* Mobile: keep Back / select / Next on one row without overflowing */
@media (max-width:720px) {
  nav .wrap { gap:8px; }
  .back-home { margin-right:0; padding:4px 10px; white-space:nowrap; }
  .toc-select { flex:1; min-width:0; max-width:none; }
  .toc-next { padding:4px 10px; white-space:nowrap; flex-shrink:0; }
}
</style>
</head>
<body style="--wrap-width:1100px;">

<nav>
  <div class="wrap">
    <a id="back-index" class="back-home" href="tasks-index.html" title="Back to task outputs index / 返回任務輸出索引">&#8592; Back</a>
    <select id="toc-select" class="toc-select" aria-label="Jump to section"></select>
    <button id="toc-next" class="toc-next" type="button" title="Next task output">Next &#8594;</button>
  </div>
</nav>

<div class="wrap task-body" id="content">
  <p class="loading">Loading…</p>
</div>

<script type="module">
import { renderMarkdown, esc, wikiExcerpt } from '../components/markdown.js';

const GITHUB_BASE = 'https://github.com/jkuo45/llm-wiki-jk/blob/dev/';

// Only files under tasks/ may be loaded through this viewer.
function safeSrc() {
  const raw = new URLSearchParams(location.search).get('src') || '';
  const decoded = decodeURIComponent(raw);
  // Optional "../" prefix (page-relative). Allow nested subdirectories
  // (e.g. tasks/en-US/<task>/file.md) but no traversal (".." segments),
  // no backslashes, no empty segments.
  const m = decoded.match(/^(?:\.\.\/)?(tasks\/.+)$/);
  if (!m) return null;
  const segs = m[1].split('/');
  const ok = segs.length >= 2 &&
    segs.every((s) => s && s !== '.' && s !== '..' && !s.includes('\\')) &&
    /\.(?:md|markdown)$/.test(segs[segs.length - 1]);
  return ok ? '../' + m[1] : null;
}

function stripFrontmatter(text) {
  return text.replace(/^---\s*\n[\s\S]*?\n---\s*\n/, '');
}

// Resolve [[Entity]] links against the note manifest (basename match),
// mirroring data.js noteUrl() without pulling in the full data module.
async function loadWikiResolver() {
  let byBase = new Map();
  try {
    const resp = await fetch('../data/manifest.json');
    if (resp.ok) {
      const manifest = await resp.json();
      Object.keys(manifest).forEach((p) => {
        if (p.endsWith('.md')) {
          const base = p.split('/').pop().replace(/\.md$/, '').toLowerCase();
          if (!byBase.has(base)) byBase.set(base, GITHUB_BASE + 'src/' + p);
        }
      });
    }
  } catch (e) { /* manifest unavailable → inert wiki links */ }
  return (label) => byBase.get(label.toLowerCase()) || '';
}

// Load entity descriptions straight from graphify-out/graph.json (every node
// carries one), keyed by label + lowercase label, so [[Entity]] links can show
// a brief excerpt on hover — mirroring the reader/prompt panel. The frontend
// serves the derived web/data/nodes.json (same build). zh-TW variants are kept
// separately and only used when a real translation exists.
async function loadEntityDescriptions() {
  const byLabel = new Map();
  const byLabelZh = new Map();
  try {
    const resp = await fetch('../data/nodes.json?v=' + Date.now());
    const g = await resp.json();
    (Array.isArray(g) ? g : (g.nodes || [])).forEach((n) => {
      if (!n.description) return;
      if (!byLabel.has(n.label)) byLabel.set(n.label, n.description);
      const lo = n.label.toLowerCase();
      if (!byLabel.has(lo)) byLabel.set(lo, n.description);
      const zh = n.description_zh_TW;
      if (zh && zh !== n.description) {
        if (!byLabelZh.has(n.label)) byLabelZh.set(n.label, zh);
        if (!byLabelZh.has(lo)) byLabelZh.set(lo, zh);
      }
    });
  } catch (e) { /* graphify-out/graph.json (via nodes.json) unavailable → entities stay plain links */ }
  return { byLabel, byLabelZh };
}

function wikiKeyFor(label, byLabel) {
  const l = (label || '').trim();
  if (!l) return null;
  if (byLabel.has(l)) return l;
  const lo = l.toLowerCase();
  return byLabel.has(lo) ? lo : null;
}

// ------------------------------------------------------------
// Wiki entity tooltip + expand modal (graphify-out/graph.json descriptions)
// ------------------------------------------------------------
const wikiTooltipEl = document.getElementById('wiki-tooltip');
const wikiModalOverlay = document.getElementById('wiki-modal-overlay');
const wikiModalTitle = document.getElementById('wiki-modal-title');
const wikiModalBody = document.getElementById('wiki-modal-body');
const wikiModalLink = document.getElementById('wiki-modal-link');
const wikiModalClose = document.getElementById('wiki-modal-close');
let wikiTooltipVisible = false;
let activeUiLang = 'en-US';
let activeByLabel = null;
let activeByLabelZh = null;
let activeHref = null;

function positionWikiTooltip(anchor) {
  if (!wikiTooltipVisible) return;
  const r = anchor.getBoundingClientRect();
  let left = r.left;
  let top = r.bottom + 8;
  const tw = wikiTooltipEl.offsetWidth || 340;
  const th = wikiTooltipEl.offsetHeight || 160;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (top + th > window.innerHeight - 8) top = r.top - th - 8;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  wikiTooltipEl.style.left = left + 'px';
  wikiTooltipEl.style.top = top + 'px';
}

function showWikiTooltip(anchor) {
  const key = anchor.dataset.wiki;
  const zh = activeUiLang === 'zh-TW' ? activeByLabelZh.get(key) : null;
  const desc = zh || activeByLabel.get(key);
  const title = anchor.textContent.trim() || key;
  const gh = anchor.dataset.gh || (activeHref && activeHref(key)) || '';
  // GitHub-note-only entities: surface a "View note on GitHub" hint so the
  // link still works (via the modal) without being an inline outbound link.
  if (!desc) {
    if (!gh) { hideWikiTooltip(); return; }
    wikiTooltipEl.innerHTML =
      `<b>${esc(title)}</b><span class="wiki-tooltip-hint">View note on GitHub ↗</span>`;
    wikiTooltipVisible = true;
    wikiTooltipEl.classList.add('visible');
    positionWikiTooltip(anchor);
    return;
  }
  const excerpt = wikiExcerpt(desc);
  if (!excerpt) return;
  wikiTooltipEl.innerHTML =
    `<b>${esc(title)}</b>${esc(excerpt)}<br><span class="wiki-tooltip-hint">Click to expand</span>`;
  wikiTooltipVisible = true;
  wikiTooltipEl.classList.add('visible');
  positionWikiTooltip(anchor);
}

function hideWikiTooltip() {
  if (!wikiTooltipVisible) return;
  wikiTooltipVisible = false;
  wikiTooltipEl.classList.remove('visible');
}

function openWikiModal(key, gh) {
  const zh = activeUiLang === 'zh-TW' ? activeByLabelZh.get(key) : null;
  const desc = zh || activeByLabel.get(key);
  const ghUrl = gh || (activeHref && activeHref(key)) || '';
  // GitHub-note-only entities have no stored summary; still open the modal so
  // the GitHub link (in the header) is reachable instead of an inline link.
  if (!desc && !ghUrl) return;
  wikiModalTitle.textContent = key.replace(/_/g, ' ');
  if (desc) {
    wikiModalBody.innerHTML = renderMarkdown(desc);
  } else {
    wikiModalBody.innerHTML =
      '<p>No summary is stored for this entity. Open the full note on GitHub.</p>';
  }
  wikiModalLink.href = ghUrl || '#';
  wikiModalLink.toggleAttribute('disabled', !ghUrl);
  wikiModalOverlay.classList.add('visible');
  hideWikiTooltip();
}

function closeWikiModal() {
  wikiModalOverlay.classList.remove('visible');
}

wikiModalClose.addEventListener('click', closeWikiModal);
wikiModalOverlay.addEventListener('click', (e) => {
  if (e.target === wikiModalOverlay) closeWikiModal();
});


// Mermaid diagram support — ```mermaid fences render as SVG figures.
// The library is imported lazily from CDN only when a fence exists; on any
// load or parse failure the original <pre><code> block stays as fallback.
// Diagram source is kept on the figure so 'wiki-theme' switches (dispatched
// by pages-core.js) re-render with the active light/dark palette.
const MERMAID_CDN = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
let mermaidLib = null;
async function getMermaid() {
  if (mermaidLib) return mermaidLib;
  const mod = await import(MERMAID_CDN);
  mermaidLib = mod.default;
  return mermaidLib;
}
const activeMermaidTheme = () => {
  try { return localStorage.getItem('llm-wiki-theme') === 'dark' ? 'dark' : 'neutral'; }
  catch { return 'neutral'; }
};
let mermaidSeq = 0;
async function renderMermaidSource(source) {
  const mermaid = await getMermaid();
  mermaid.initialize({
    startOnLoad: false,
    theme: activeMermaidTheme(),
    securityLevel: 'loose', // first-party vault content; enables <br/> in labels
    flowchart: { htmlLabels: true, useMaxWidth: true },
  });
  const id = 'mmd-' + (++mermaidSeq);
  try {
    const { svg } = await mermaid.render(id, source);
    return svg;
  } catch (err) {
    document.getElementById('d' + id)?.remove(); // drop mermaid's error element
    throw err;
  }
}
async function renderMermaidDiagrams(root) {
  const blocks = root.querySelectorAll('code.language-mermaid');
  if (!blocks.length) return;
  for (const code of blocks) {
    const pre = code.closest('pre');
    if (!pre) continue;
    const source = code.textContent;
    try {
      const svg = await renderMermaidSource(source);
      const fig = document.createElement('div');
      fig.className = 'mermaid-figure';
      fig.dataset.mermaidSource = source;
      fig.innerHTML = svg;
      pre.replaceWith(fig);
    } catch (err) {
      console.warn('mermaid render failed; keeping code block', err);
    }
  }
}
document.addEventListener('wiki-theme', () => {
  document.querySelectorAll('.mermaid-figure[data-mermaid-source]').forEach(async (fig) => {
    try { fig.innerHTML = await renderMermaidSource(fig.dataset.mermaidSource); }
    catch { /* keep the previous rendering on failure */ }
  });
});

// Group rendered blocks under <section id> per h1/h2 so the reader's
// scroll tracking and #section deep links work like article pages.
function structureSections(container) {
  const headings = container.querySelectorAll('h1[id], h2[id]');
  let current = null;
  Array.from(container.children).forEach((node) => {
    if (node.matches('h1[id], h2[id]')) {
      current = document.createElement('section');
      current.id = node.id;
      container.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  });
  return Array.from(container.querySelectorAll(':scope > section'));
}

const src = safeSrc();

if (!src) {
  document.getElementById('content').innerHTML =
    '<p class="error">Invalid or missing ?src= parameter.</p>';
} else {
  try {
    const [resp, wikiHref, entity] = await Promise.all([
      fetch(src),
      loadWikiResolver(),
      loadEntityDescriptions(),
    ]);
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    const md = stripFrontmatter(await resp.text());
    const content = document.getElementById('content');
    content.innerHTML = renderMarkdown(md, { wikiHref });
    // Fire-and-forget: fences swap to SVG figures in place; the fallback
    // <pre><code> stays until (and if) the CDN import/render succeeds.
    renderMermaidDiagrams(content);

    // Upgrade [[Entity]] links that have a graphify-out/graph.json description into
    // tooltip-enabled entity links (the rest keep their GitHub fallback).
    activeUiLang = src.includes('/zh-TW/') ? 'zh-TW' : 'en-US';
    activeByLabel = entity.byLabel;
    activeByLabelZh = entity.byLabelZh;
    activeHref = wikiHref;
    content.querySelectorAll('a.wikilink, span.wikilink').forEach((el) => {
      const label = el.textContent.trim();
      const key = wikiKeyFor(label, entity.byLabel);
      const gh = wikiHref ? wikiHref(label) : '';
      // Upgrade to a tooltip span when the entity has either a stored
      // description or a GitHub note (the GitHub link moves into the modal).
      if (!key && !gh) return;
      const span = document.createElement('span');
      span.className = 'task-entity-link';
      span.dataset.wiki = key || label;
      if (gh) span.dataset.gh = gh;
      span.textContent = label;
      el.replaceWith(span);
    });
    content.addEventListener('mouseover', (e) => {
      const a = e.target.closest('.task-entity-link');
      if (!a || !a.dataset.wiki) { hideWikiTooltip(); return; }
      showWikiTooltip(a);
    });
    content.addEventListener('mousemove', (e) => {
      if (!wikiTooltipVisible) return;
      const a = e.target.closest('.task-entity-link');
      if (a) positionWikiTooltip(a);
    });
    content.addEventListener('mouseleave', hideWikiTooltip);
    content.addEventListener('click', (e) => {
      const a = e.target.closest('.task-entity-link');
      if (a) { e.preventDefault(); openWikiModal(a.dataset.wiki, a.dataset.gh); }
    });
    // Wrap tables so wide ones scroll horizontally instead of overflowing.
    content.querySelectorAll('table').forEach((t) => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    const sections = structureSections(content);
    const firstH1 = content.querySelector('h1');
    if (firstH1) document.title = firstH1.textContent;
    // Next button → open the next task output document (registry order,
    // newest first — mirrors the reader dropdown). The registry is fetched
    // lazily; the button stays inert until a next document resolves.
    const NAV_OFFSET = 60; // matches nav height + breathing room
    const tocSelect = document.getElementById('toc-select');
    const nextBtn = document.getElementById('toc-next');
    let nextHref = null;

    async function initNextTask() {
      try {
        const resp = await fetch('../data/tasks.json');
        if (!resp.ok) return;
        const data = await resp.json();
        // Flatten to one row per entry (prefer en-US), keep .md docs only.
        const rows = (data.tasks || [])
          .filter((t) => t.active !== false)
          .map((t) => t.langs?.['en-US'] || Object.values(t.langs || {})[0])
          .filter((l) => l && l.path && /\.md$/.test(l.path))
          .sort((a, b) => (b.created || '').localeCompare(a.created || ''));
        const curPath = decodeURIComponent(
          new URLSearchParams(location.search).get('src') || ''
        ).replace(/^\.\.\//, '');
        const idx = rows.findIndex((l) => l.path === curPath);
        const next = idx >= 0 ? rows[idx + 1] : rows[0];
        if (next) {
          nextHref = 'task-viewer.html?src=' +
            encodeURIComponent('../' + next.path);
          nextBtn.title = 'Next task output: ' + next.title;
        }
      } catch (e) { /* registry unavailable → button stays inert */ }
    }
    initNextTask();

    nextBtn.addEventListener('click', () => {
      if (nextHref) location.href = nextHref;
    });

    tocSelect.innerHTML = '<option value="">Top</option>' + sections.map((s) => {
      const label = s.querySelector('h1,h2')?.textContent || s.id;
      return `<option value="#${s.id}">${label}</option>`;
    }).join('');

    const scrollToSection = (id) => {
      if (!id) { window.scrollTo(0, 0); return; }
      const el = document.getElementById(id);
      if (el) window.scrollTo(0, el.offsetTop - NAV_OFFSET);
    };

    tocSelect.addEventListener('change', () => {
      const id = tocSelect.value.replace(/^#/, '');
      scrollToSection(id);
      history.replaceState(null, '', id ? '#' + id : location.pathname + location.search);
    });

    // Section currently scrolled under the sticky nav → sync the select.
    const currentSectionId = () => {
      let active = '';
      for (const s of sections) {
        if (s.getBoundingClientRect().top <= NAV_OFFSET + 1) active = s.id;
      }
      return active;
    };
    const syncToc = () => {
      const id = currentSectionId();
      if (('#' + id) !== tocSelect.value) {
        tocSelect.value = id ? '#' + id : '';
      }
    };
    window.addEventListener('scroll', syncToc, { passive: true });
    syncToc();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<p class="error">Failed to load task output: ${e.message}</p>`;
  }
}

// Auto-hide the sticky <nav> on scroll (hide on scroll down, show on scroll up)
// Wired at top level so it applies even before/after task markdown loads.
{
  const topNav = document.querySelector('nav');
  if (topNav) {
    let lastY = window.scrollY;
    let navHidden = false;
    const THRESH = 6;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      const navH = topNav.offsetHeight || 52;
      const down = y > lastY + THRESH;
      const up = y < lastY - THRESH;
      if (down && y > navH && !navHidden) { topNav.classList.add('nav-hidden'); navHidden = true; }
      else if (up && navHidden) { topNav.classList.remove('nav-hidden'); navHidden = false; }
      if (Math.abs(y - lastY) > THRESH) lastY = y;
    }, { passive: true });
  }
}
</script>
