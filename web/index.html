<script>
  /* Site-wide theme bootstrap (light is the default; only an explicit 'dark'
     preference opts into dark). Runs before first paint so the light
     stylesheet starts in the right state — mirrors web/pages/shared/page-theme.js
     for the app shell. The value is driven by components/theme.js on demand. */
  (function () {
    var link = document.getElementById('theme-light');
    if (!link) return;
    var dark = false;
    try { dark = localStorage.getItem('llm-wiki-theme') === 'dark'; } catch (e) {}
    link.disabled = dark;
  })();
</script>
