<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles — Index</title>
<meta name="description" content="Index of all articles in the llm-wiki-jk knowledge base, grouped by when they were created, with en-US editions and zh-TW editions alongside.">
<link rel="canonical" href="https://graph.johnnykuo.com/pages/index.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">
<link rel="stylesheet" href="themes/theme-02/theme.css">
<script src="themes/theme-02/theme.js"></script>
<script src="themes/theme-02/pages-core.js"></script>
<style>
.index { padding: 28px 0 48px; }

.bucket-heading {
  font-family: var(--serif);
  font-size: 1.3rem;
  letter-spacing: -0.01em;
  margin: 34px 0 14px;
}
.bucket-heading:first-child { margin-top: 0; }
.bucket-count {
  font-family: var(--mono); font-size: 12px; color: var(--faint);
  vertical-align: middle; margin-left: 8px;
}

.article-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Card chrome (surface, border, accent variants) comes from theme.css .card */
.article-card {
  position: relative;
  padding: 20px 22px 16px;
  margin-bottom: 18px;
  transition: border-color 0.15s ease, transform 0.15s ease;
}

.article-card:hover {
  border-left-color: var(--oxblood-soft);
  transform: translateY(-1px);
}

.article-title {
  font-family: var(--serif);
  font-size: 1.22rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}

.article-title a {
  color: var(--ink);
  text-decoration: none;
}

.article-title a:hover { color: var(--oxblood); }
/* Star badge: gray outline when not starred, filled accent when starred */
.star-badge {
  position: absolute;
  bottom: 12px;
  right: 12px;
  font-size: 1rem;
  line-height: 1;
  pointer-events: none;
}
.star-badge.on { color: #d4a017; }
.star-badge.off { color: var(--rule); -webkit-text-stroke: 0.5px var(--faint); }

.article-zh {
  font-size: 1.02rem;
  color: var(--ink-soft);
  margin: 0 0 12px;
}

.article-zh a {
  color: var(--mute);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.article-zh a:hover {
  color: var(--oxblood);
  border-bottom-color: var(--oxblood);
}

.article-meta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--faint);
  margin: 0 0 4px;
}

.article-meta:last-child { margin-bottom: 0; }

/* Badge base + fill/accent variants come from theme.css .badge.fill */

/* Freshness badge mirrors the task outputs index buckets */
.fresh { color: #15803d; }
.recent { color: #b45309; }
.old { color: var(--faint); }
[data-theme="dark"] .fresh { color: #38c793; }
[data-theme="dark"] .recent { color: #ffb020; }

.empty-note {
  font-style: italic;
  color: var(--mute);
  padding: 24px 0;
}

@media (max-width: 640px) {
  .article-card { padding: 16px 16px 14px; }
}
</style>
<link rel="stylesheet" href="themes/theme-02/dark.css">
</head>
<body>
<main class="index" id="content">
  <div class="wrap">
    <ul class="article-list" id="articleList"></ul>
    <p class="empty-note" id="emptyNote" hidden></p>
  </div>
</main>

<script>
(function(){
  const ACCENTS = ['', 'slate', 'forest', 'gold'];
  const list = document.getElementById('articleList');
  const emptyNote = document.getElementById('emptyNote');

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function relAge(created){
    if (!created) return '';
    const ms = Date.now() - new Date(created).getTime();
    if (ms < 864e5) return 'today';
    const days = Math.floor(ms / 864e5);
    if (days < 7) return days + 'd';
    if (days < 30) return Math.floor(days / 7) + 'w';
    if (days < 365) return Math.floor(days / 30) + 'mo';
    return (days / 365).toFixed(1) + 'y';
  }
  function bucket(created){
    if (!created) return 2;
    const days = (Date.now() - new Date(created).getTime()) / 864e5;
    return days <= 7 ? 0 : days <= 30 ? 1 : 2;
  }
  const BUCKETS = [
    ['Created this week', '本週建立', 'fresh'],
    ['Created this month', '本月建立', 'recent'],
    ['Older', '較早', 'old'],
  ];

  fetch('../data/articles.json')
    .then(r => r.json())
    .then(data => {
      const articles = data
        .filter(a => a.active !== false && a.id !== 'articles-index' && a.langs && a.langs['en-US'])
        .map((a, ai) => {
          const en = a.langs['en-US'];
          const zh = a.langs['zh-TW'];
          return {
            id: a.id,
            _idx: ai,
            display: en.title,
            starred: a.starred === true,
            zhTitle: zh ? zh.title : '',
            enPath: en.path.replace(/^pages\//, ''),
            zhPath: zh ? zh.path.replace(/^pages\//, '') : en.path.replace(/^pages\//, ''),
            created: en.created || '',
            age: relAge(en.created || ''),
            bucket: bucket(en.created || '')
          };
        })
        .sort((x, y) => (y.starred - x.starred) ||
          (y.created || '').localeCompare(x.created || ''));

      let html = '';
      BUCKETS.forEach(([label, zhLabel, cls], bi) => {
        const group = articles.filter(a => a.bucket === bi);
        if (!group.length) return;
        html += `<h2 class="bucket-heading">${label} / ${zhLabel}` +
                `<span class="bucket-count">${group.length}</span></h2><ul class="article-list">`;
        html += group.map((a) => `
          <li class="article-card card ${ACCENTS[a._idx % ACCENTS.length]}">
            <span class="star-badge ${a.starred ? 'on' : 'off'}" title="${a.starred ? 'Starred' : ''}">${a.starred ? '★' : '☆'}</span>
            <h2 class="article-title"><a href="${esc(a.enPath)}" data-article-id="${esc(a.id)}">${esc(a.display)}</a></h2>
            <p class="article-zh"><a href="${esc(a.zhPath)}" data-article-id="${esc(a.id)}-zh" lang="zh-TW">${esc(a.zhTitle)}</a></p>
            <p class="article-meta"><span class="badge fill">${esc(a.id)}</span></p>
            <p class="article-meta"><span class="${cls}">${a.age === 'today' ? 'created today' : `created ${esc(a.age)} ago`} (${esc(a.created)})</span></p>
          </li>`).join('');
        html += '</ul>';
      });
      list.innerHTML = html;
      emptyNote.hidden = articles.length > 0;
      if (!articles.length) emptyNote.textContent = 'No active articles found.';

      /* Embedded in the Reader: announce navigation so the parent
         dropdown/lang toggle updates immediately (before iframe load). */
      list.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-article-id]');
        if (!a) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'reader-navigate',
              id: a.dataset.articleId
            }, window.location.origin);
          }
        } catch { /* standalone view — nothing to notify */ }
      });
    })
    .catch(err => {
      emptyNote.textContent = 'Failed to load data/articles.json: ' + err.message;
      emptyNote.hidden = false;
    });
})();
</script>
</body>
</html>
