<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Knowledge graph exploring longevity through adrenochrome, autophagy, mitohormesis, and disease prevention. Biomedical wiki visualization. EN/中文 graph agent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<title>llm-wiki-jk: graph view (EN/中文)</title>
<link rel="stylesheet" href="three-graph.css">
</head>
<body>
<button id="mobile-toggle" class="visible" title="Open search and filters">&#9776;</button>
<div id="top-links">
  <a href="https://www.johnnykuo.com" title="Back to Notebook / 返回筆記本">&#8592; Notebook / 筆記本</a>
  <button id="btn-reader" title="Read articles / 閱讀文章">Reader / 閱讀器</button>
</div>
<div id="graph">
  <div id="loading">
    <div class="spinner"></div>
    <h2>Loading Graph Data</h2>
    <p id="load-status">Initializing...</p>
  </div>
  <div id="tooltip"></div>
  <div id="wiki-tooltip"></div>
  <div id="controls">
    <button id="btn-reset" title="Reset camera / 重設視角">Reset View / 重設視角</button>
    <button id="btn-dataset" title="About this dataset / 關於此資料集" aria-label="About this dataset">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </button>
    <button id="btn-save-png" title="Save as PNG / 另存為 PNG" aria-label="Save as PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
    <button id="btn-unstick" title="Reset all dragged nodes to physics positions" style="display:none">Unstick All / 取消固定</button>
  </div>
  <div id="zoom-bar">
    <button id="zoom-in" title="Zoom in">+</button>
    <div id="zoom-slider-track">
      <div id="zoom-slider-fill"></div>
      <div id="zoom-slider-thumb"></div>
    </div>
    <button id="zoom-out" title="Zoom out">&minus;</button>
    <span class="zoom-label">Zoom</span>
  </div>
</div>
<div id="sidebar" class="closed">
  <div id="sidebar-header">
    <div id="sidebar-tabs" role="tablist">
      <button type="button" class="tab active" id="tab-btn-search" data-tab="search" role="tab" aria-selected="true">Search & Filters<span class="tab-zh">搜尋與篩選</span></button>
      <button type="button" class="tab" id="tab-btn-settings" data-tab="settings" role="tab" aria-selected="false">Settings<span class="tab-zh">設定</span></button>
    </div>
    <button id="sidebar-close" title="Close panel">&times;</button>
  </div>
  <div class="tab-pane" id="tab-search">
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search nodes / 搜尋節點..." autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div id="trace-panel">
      <div id="trace-header">
        <span>Graph Query / 圖形查詢</span>
        <span class="chevron" id="trace-chevron">&#9654;</span>
      </div>
      <div id="trace-body">
        <select id="trace-select">
          <option value="">Select a query...</option>
        </select>
        <div id="trace-summary"></div>
        <div id="trace-routes"></div>
        <div id="trace-key-nodes"></div>
        <button id="trace-clear">Clear Trace / 清除追蹤</button>
      </div>
    </div>
    <div id="info-panel">
      <h3>Node Info / 節點資訊</h3>
      <div id="info-content"><span class="empty">Click a node to inspect it / 點擊節點以檢查</span></div>
    </div>
    <div id="legend-wrap">
      <div id="community-key-nodes"></div>
      <h3>Communities / 社群</h3>
      <div id="legend"></div>
    </div>
    <div id="stats"></div>
  </div>
  <div class="tab-pane" id="tab-settings" hidden>
    <div id="display-panel">
      <h3>Display / 顯示</h3>
      <div class="display-grid">
        <button id="btn-physics" title="Toggle physics simulation">Physics / 物理</button>
        <button id="btn-labels" title="Toggle labels">Labels / 標籤</button>
        <button id="btn-edges" title="Toggle edges">Edges / 邊緣</button>
      </div>
    </div>
  </div>
</div>

<!-- Dataset info panel (content rendered by graph.js from loaded data) -->
<div id="dataset-panel">
  <div class="panel-scroll" id="dataset-scroll"></div>
</div>
<button id="chat-btn" title="Analysis panel / 分析面板" aria-label="Analysis panel"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div id="chat-panel">
  <div id="chat-header">
    <span>Analysis / 分析</span>
    <div class="chat-header-actions">
      <label id="chat-filter-toggle" title="Only show the highlighted nodes and their links">
        <input type="checkbox" id="chat-filter-nodes" disabled>
        <span>Filter (<span id="chat-filter-count">0</span>)</span>
      </label>
      <button id="chat-new" title="New analysis / 新分析">New</button>
      <button id="chat-maximize" title="Maximize window / 放大視窗" aria-label="Maximize window">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1H1V5"/><path d="M9 13H13V9"/><path d="M1 9V13H5"/><path d="M13 5V1H9"/></svg>
      </button>

      <button id="chat-close" title="Close chat / 關閉對話" aria-label="Close chat">&times;</button>
    </div>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-modes">
    <label id="graphify-toggle" title="On: run graph operations (explain / trace / path). Off: answer from the wiki.">
      <input type="checkbox" id="graphify-checkbox" checked>
      <span>Graphify</span>
    </label>
    <div id="graphify-ops" role="group" aria-label="Graphify operations">
      <button type="button" class="graphify-op" data-op="query" title="Open-ended, natural language questions / 開放式自然語言提問">query</button>
      <button type="button" class="graphify-op" data-op="explain" title="Deep dive on a single entity / 深入解釋單一實體">explain</button>
      <button type="button" class="graphify-op" data-op="path" title="Traces the direct relationship between two or more nodes / 追蹤兩個以上節點之間的直接關係">path</button>
    </div>
    <span id="graphify-off-hint">Wiki retrieval</span>
  </div>
  <div id="chat-tags"></div>
  <div id="chat-input-wrap">
    <div id="chat-tag-popup"></div>
    <textarea id="chat-input" rows="3" enterkeyhint="send" maxlength="500" placeholder="Analyze the graph — type @ to tag nodes (e.g. @NAD+ @SIRT1)"></textarea>
    <button id="chat-send" title="Send">Send</button>
  </div>
</div>

<!-- Wiki Modal -->
<div id="wiki-modal-overlay">
  <div id="wiki-modal">
    <div id="wiki-modal-header">
      <h2 id="wiki-modal-title"></h2>
      <div class="wiki-modal-actions">
        <a id="wiki-modal-link" href="#" target="_blank" rel="noopener" class="wiki-modal-link">GitHub <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 1H9V7M9 1L1 9"/></svg></a>
        <button id="wiki-modal-close" title="Close">&times;</button>
      </div>
    </div>
    <div id="wiki-modal-body"></div>
  </div>
</div>

<!-- Reader modal (loads articles in iframe) -->
<div id="page-modal-overlay">
  <div id="page-modal">
    <div id="page-modal-header">
      <div class="page-modal-header-row">
        <h2 id="page-modal-title">Reader / 閱讀器</h2>
        <div class="page-modal-actions">
          <button id="reader-prev" title="Previous article / 上一篇文章" disabled>&larr;</button>
          <a id="page-modal-open" href="#" target="_blank" rel="noopener" title="Open in new tab / 新分頁開啟" aria-label="Open in new tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <button id="page-modal-close" title="Close / 關閉">&times;</button>
        </div>
      </div>
      <select id="reader-select" title="Choose article / 選擇文章"></select>
    </div>
    <iframe id="page-modal-frame" title="Reader"></iframe>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="components/graph.js"></script>
</body>
</html>
